<!doctype html>
<html lang="bn">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Business POS System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#0f766e;--primary2:#115e59;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--border:#e5e7eb;--danger:#dc2626;--shadow:0 10px 30px rgba(15,23,42,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Bengali",system-ui,sans-serif}
    button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
    .login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#ecfeff,#f8fafc)}
    .login-card{width:min(420px,100%);background:var(--card);padding:32px;border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}.logo{width:48px;height:48px;border-radius:14px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800}
    h1,h2,h3,p{margin-top:0}.muted{color:var(--muted);font-size:13px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
    input,select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;outline:none}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,.1)}
    .btn{padding:10px 15px;border-radius:10px;background:var(--primary);color:#fff;font-weight:700}.btn:hover{background:var(--primary2)}.btn.secondary{background:#eef2f7;color:var(--text)}.btn.danger{background:var(--danger)}
    .error{background:#fef2f2;color:#b91c1c;padding:10px;border-radius:10px;font-size:13px;margin:10px 0}
    .app{min-height:100vh}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}
    .top-left{display:flex;align-items:center;gap:12px}.hamb{background:#eef2f7;color:#111827;padding:8px 11px;border-radius:9px}.user{font-size:13px;color:var(--muted)}
    .layout{display:flex}.sidebar{width:255px;background:#fff;border-right:1px solid var(--border);min-height:calc(100vh - 64px);padding:15px;position:fixed;top:64px;bottom:0;overflow:auto;transition:.2s;z-index:9}
    .sidebar.closed{transform:translateX(-100%)}.nav-title{font-size:11px;color:#94a3b8;font-weight:800;margin:15px 8px 7px;text-transform:uppercase}.nav{display:block;width:100%;text-align:left;padding:10px 12px;background:transparent;color:#475569;border-radius:9px;margin:2px 0}.nav.active,.nav:hover{background:#ecfdf5;color:var(--primary);font-weight:700}
    main{width:100%;padding:22px;margin-left:255px;transition:.2s}.sidebar.closed~main{margin-left:0}.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.page-head h2{margin:0;font-size:23px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:17px;box-shadow:0 4px 15px rgba(15,23,42,.03)}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:24px;font-weight:800;margin-top:5px}
    .two{display:grid;grid-template-columns:1.5fr 1fr;gap:15px;margin-top:15px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}.table th{background:#f8fafc;color:#475569}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{max-width:280px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:16px;z-index:50}.modal-box{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .toast{position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;z-index:100}.loading{opacity:.6;pointer-events:none}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}main{margin-left:0}.form-grid{grid-template-columns:1fr}}
    @media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.topbar{padding:0 10px}main{padding:14px}.card{padding:13px}.page-head h2{font-size:19px}}
  </style>
</head>
<body>
<div id="loginView" class="login">
  <div class="login-card">
    <div class="brand"><div class="logo">POS</div><div><h2 style="margin:0">Business POS</h2><div class="muted">Sales • Inventory • Accounting</div></div></div>
    <div id="loginError" class="error hidden"></div>
    <div class="field"><label>Username / Email</label><input id="username" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="btn" style="width:100%" onclick="login()">Login</button>
    <p class="muted" style="margin-top:15px">প্রথমবার ব্যবহার করার আগে Apps Script থেকে <b>setupDatabase()</b> চালান।</p>
  </div>
</div>

<div id="appView" class="app hidden">
  <header class="topbar"><div class="top-left"><button class="hamb" onclick="toggleSidebar()">☰</button><b>Business POS System</b></div><div class="top-left"><span id="userInfo" class="user"></span><button class="btn secondary" onclick="logout()">Logout</button></div></header>
  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="nav-title">Overview</div><button class="nav active" data-page="dashboard" onclick="page('dashboard')">📊 Dashboard</button>
      <div class="nav-title">POS / Sales</div><button class="nav" data-page="sales" onclick="page('sales')">🛒 New Sale</button><button class="nav" data-page="salesHistory" onclick="page('salesHistory')">🧾 Sales History</button>
      <div class="nav-title">Products</div><button class="nav" data-page="products" onclick="page('products')">📦 Products</button><button class="nav" data-page="inventory" onclick="page('inventory')">📋 Inventory</button>
      <div class="nav-title">Purchase</div><button class="nav" data-page="purchases" onclick="page('purchases')">🚚 Purchases</button>
      <div class="nav-title">Parties</div><button class="nav" data-page="customers" onclick="page('customers')">👥 Customers</button><button class="nav" data-page="suppliers" onclick="page('suppliers')">🏭 Suppliers</button>
      <div class="nav-title">Finance</div><button class="nav" data-page="expenses" onclick="page('expenses')">💳 Expenses</button><button class="nav" data-page="reports" onclick="page('reports')">📈 Reports</button><button class="nav" data-page="accounting" onclick="page('accounting')">📚 Accounting</button>
      <div class="nav-title">System</div><button class="nav" data-page="syncCenter" onclick="page('syncCenter')">🔄 Sync Center</button><button class="nav" data-page="developer" onclick="page('developer')">🧑‍💻 Developer</button><button class="nav" data-page="settings" onclick="page('settings')">⚙️ Settings</button><button class="nav" data-page="health" onclick="page('health')">🩺 System Health</button>
    </aside>
    <main id="main"></main>
  </div>
</div>
<div id="modal" class="modal hidden"><div id="modalBox" class="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
let TOKEN=localStorage.getItem('pos_token')||'', USER=null, currentPage='dashboard', cache={};
const $=id=>document.getElementById(id);
function call(action,payload={}){
  const hasGAS=typeof google!=='undefined'&&google.script&&google.script.run;
  if(hasGAS) return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(e)).api(TOKEN,action,payload));
  return fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,action,payload})})
    .then(r=>r.json()).then(r=>{if(!r.success)throw new Error(r.error||'API request failed');return r.data;});
}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}
function toggleSidebar(){$('sidebar').classList.toggle('open');$('sidebar').classList.toggle('closed')}
async function login(){
  $('loginError').classList.add('hidden');
  try{const r=await call('login',{username:$('username').value.trim(),password:$('password').value});TOKEN=r.token;USER=r.user;localStorage.setItem('pos_token',TOKEN);showApp()}
  catch(e){$('loginError').textContent=e.message||e;$('loginError').classList.remove('hidden')}
}
function showApp(){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('userInfo').textContent=USER?USER.username+' • '+USER.role:'';page(currentPage);startAutoSync()}
async function logout(){try{await call('logout',{})}catch(e){}localStorage.removeItem('pos_token');TOKEN='';location.reload()}
async function page(name){currentPage=name;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===name));$('sidebar').classList.remove('open');if(name==='dashboard')return dashboard();if(name==='products')return products();if(name==='inventory')return inventory();if(name==='sales'||name==='salesHistory')return sales(name==='salesHistory');if(name==='purchases')return purchases();if(name==='customers')return parties('customers');if(name==='suppliers')return parties('suppliers');if(name==='expenses')return expenses();if(name==='reports')return reports();if(name==='accounting')return accounting();if(name==='syncCenter')return syncCenter();if(name==='developer')return developer();if(name==='settings')return settings();if(name==='health')return health()}
function money(v){return '৳ '+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
async async function dashboard(){main('<div class="page-head"><h2>Dashboard</h2><button class="btn secondary" onclick="dashboard()">↻ Refresh</button></div><div id="stats" class="grid"><div class="card">Loading...</div></div><div class="two"><div class="card"><h3>Quick Actions</h3><div class="toolbar"><button class="btn" onclick="page('sales')">New Sale</button><button class="btn secondary" onclick="page('products')">Add Product</button><button class="btn secondary" onclick="page('purchases')">New Purchase</button><button class="btn secondary" onclick="page('expenses')">Add Expense</button></div></div><div class="card"><h3>System</h3><p class="muted">Google Sheets database • Apps Script backend</p><button class="btn secondary" onclick="sync()">🔄 Sync Now</button></div></div>');try{const d=await call('dashboard');$('stats').innerHTML=[['Today Sales',d.todaySales],['Today Purchase',d.todayPurchase],['Today Expense',d.todayExpense],['Net Today',d.todayNet],['Products',d.totalProducts],['Stock Value',d.stockValue],['Low Stock',d.lowStock],['Out of Stock',d.outOfStock],['Customers',d.totalCustomers],['Suppliers',d.totalSuppliers],['Customer Due',d.customerDue],['Supplier Due',d.supplierDue]].map(x=>'<div class="card stat"><div class="label">'+x[0]+'</div><div class="value">'+(typeof x[1]==='number'&&x[0]!== 'Products'&&x[0]!=='Low Stock'&&x[0]!=='Out of Stock'&&x[0]!=='Customers'&&x[0]!=='Suppliers'?money(x[1]):Number(x[1]||0).toLocaleString())+'</div></div>').join('')}catch(e){toast(e.message||e)}}
async function products(){main('<div class="page-head"><h2>Products</h2><button class="btn" onclick="productModal()">+ Add Product</button></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search product, SKU, barcode..." oninput="loadProducts()"></div><div id="table" class="table-wrap">Loading...</div></div>');loadProducts()}
async function loadProducts(){try{const r=await call('products',{search:$('search')?.value||''});cache.products=r.rows;$('table').innerHTML=table(r.rows,['Product_ID','Product_Name','SKU','Barcode','Category','Selling_Price','Current_Stock','Status'],r=>'<button class="btn secondary" onclick=productModal('+JSON.stringify(encodeURIComponent(JSON.stringify(r)))+')>Edit</button>')}catch(e){toast(e.message||e)}}
function productModal(encoded){let p={};if(encoded)try{p=JSON.parse(decodeURIComponent(encoded))}catch(e){};modal('<div class="modal-head"><h3>'+(p.Product_ID?'Edit':'Add')+' Product</h3><button class="btn secondary" onclick="closeModal()">✕</button></div><div class="form-grid">'+field('Product_Name','Product Name',p.Product_Name)+field('Barcode','Barcode',p.Barcode)+field('SKU','SKU',p.SKU)+field('Category','Category',p.Category)+field('Brand','Brand',p.Brand)+field('Purchase_Price','Purchase Price',p.Purchase_Price,'number')+field('Selling_Price','Selling Price',p.Selling_Price,'number')+field('Discount_Price','Discount Price',p.Discount_Price,'number')+field('Current_Stock','Opening/Current Stock',p.Current_Stock,'number')+field('Minimum_Stock','Minimum Stock',p.Minimum_Stock||5,'number')+field('Unit','Unit',p.Unit||'pcs')+'</div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick=saveProduct("'+(p.Product_ID||'')+'")>Save</button></div>')}
async function saveProduct(id){const p={Product_ID:id};['Product_Name','Barcode','SKU','Category','Brand','Purchase_Price','Selling_Price','Discount_Price','Current_Stock','Minimum_Stock','Unit'].forEach(k=>p[k]=$(k)?.value);try{await call('saveProduct',p);closeModal();toast('Product saved');loadProducts()}catch(e){toast(e.message||e)}}
async function inventory(){
main('<div class="page-head"><h2>Inventory</h2><div class="toolbar"><button class="btn" onclick="stockAdjustModal()">± Stock Adjustment</button><button class="btn secondary" onclick="loadInventory()">↻ Refresh</button></div></div><div class="grid"><div class="card stat"><div class="label">Total Products</div><div id="invProducts" class="value">—</div></div><div class="card stat"><div class="label">Low Stock</div><div id="invLow" class="value">—</div></div><div class="card stat"><div class="label">Out of Stock</div><div id="invOut" class="value">—</div></div><div class="card stat"><div class="label">Stock Value</div><div id="invValue" class="value">—</div></div></div><div class="two"><div class="card"><h3>Stock List</h3><div class="toolbar"><input id="invSearch" placeholder="Search product / SKU / barcode" oninput="loadInventory()"></div><div id="invTable">Loading...</div></div><div class="card"><h3>Recent Stock Movements</h3><div id="movementTable">Loading...</div></div></div>');
loadInventory();loadMovements();
}
async async function loadInventory(){
try{
const r=await call('products',{search:$('invSearch')?.value||''}), rows=r.rows||[];
$('invProducts').textContent=rows.length;
$('invLow').textContent=rows.filter(x=>Number(x.Current_Stock||0)<=Number(x.Minimum_Stock||5)&&Number(x.Current_Stock||0)>0).length;
$('invOut').textContent=rows.filter(x=>Number(x.Current_Stock||0)<=0).length;
$('invValue').textContent=money(rows.reduce((a,x)=>a+Number(x.Current_Stock||0)*Number(x.Purchase_Price||0),0));
$('invTable').innerHTML=table(rows,['Product_ID','Product_Name','SKU','Barcode','Current_Stock','Minimum_Stock','Purchase_Price','Selling_Price'],x=>'<button class="btn secondary" onclick="stockAdjustModal(\\''+x.Product_ID+'\\')">Adjust</button>');
}catch(e){toast(e.message||e)}
}
async function loadMovements(){
try{const r=await call('stockMovements',{});$('movementTable').innerHTML=table(r.rows,['Movement_ID','Product_ID','Type','Quantity','Before_Qty','After_Qty','Created_By','Created_At'])}catch(e){toast(e.message||e)}
}
function stockAdjustModal(productId){
modal('<div class="modal-head"><h3>Stock Adjustment</h3><button class="btn secondary" onclick="closeModal()">✕</button></div><div class="form-grid">'+field('adjustProduct','Product ID',productId||'')+field('adjustQty','Quantity','1','number')+field('adjustType','Action','ADD')+field('adjustRef','Reference / Note')+'</div><p class="muted">Action: ADD অথবা REMOVE</p><div class="actions"><button class="btn" onclick="saveStockAdjustment()">Save Adjustment</button></div>');
}
async function saveStockAdjustment(){
try{
const type=String($('adjustType').value||'ADD').toUpperCase();
if(!['ADD','REMOVE'].includes(type))throw new Error('Action must be ADD or REMOVE.');
const r=await call('stockAdjustment',{Product_ID:$('adjustProduct').value,Quantity:Number($('adjustQty').value),Type:type,Reference_ID:$('adjustRef').value});
closeModal();toast('Stock updated: '+r.currentStock);loadInventory();loadMovements();
}catch(e){toast(e.message||e)}
}
async function sales(history){
if(history){
main('<div class="page-head"><h2>Sales History</h2><button class="btn secondary" onclick="sales(true)">↻ Refresh</button></div><div class="card"><div class="toolbar"><input id="search" placeholder="Invoice / customer / ID search..." oninput="loadSales()"></div><div id="table">Loading...</div></div>');
loadSales(); return;
}
main('<div class="page-head"><h2>New Sale</h2><button class="btn secondary" onclick="page(\'salesHistory\')">Sales History</button></div><div class="card"><div class="toolbar"><input id="productSearch" placeholder="Product name / SKU / barcode" onkeydown="if(event.key===\'Enter\')searchSaleProduct()" autofocus><button class="btn secondary" onclick="searchSaleProduct()">🔎 Search</button></div><div id="productResults"></div><hr><h3>Cart</h3><div id="cart"></div><div class="form-grid" style="margin-top:15px"><div class="field"><label>Customer ID</label><input id="saleCustomer"></div><div class="field"><label>Paid Amount</label><input id="salePaid" type="number" value="0"></div><div class="field"><label>Payment Method</label><input id="saleMethod" value="Cash"></div></div><div id="saleTotal" style="text-align:right;font-size:20px;font-weight:800;margin-top:12px">Total: ৳ 0</div><div class="actions"><button class="btn" onclick="createSaleFromCart()">Complete Sale</button></div></div>');
window.saleCart=[]; renderCart();
}
async function searchSaleProduct(){
const q=$('productSearch')?.value||'';
if(!q)return;
try{const r=await call('searchProduct',{q});$('productResults').innerHTML=table(r.rows,['Product_Name','SKU','Barcode','Selling_Price','Current_Stock'],p=>'<button class="btn secondary" onclick="addToCart('+JSON.stringify(encodeURIComponent(JSON.stringify(p)))+')">Add</button>')}
catch(e){toast(e.message||e)}
}
function addToCart(encoded){
let p=JSON.parse(decodeURIComponent(encoded)), old=window.saleCart.find(x=>x.Product_ID===p.Product_ID);
if(old)old.Qty++;else window.saleCart.push({Product_ID:p.Product_ID,Product_Name:p.Product_Name,Unit_Price:Number(p.Selling_Price||0),Qty:1,Stock:Number(p.Current_Stock||0)});
renderCart();
}
function renderCart(){
const el=$('cart'); if(!el)return;
if(!window.saleCart.length){el.innerHTML='<p class="muted">Cart is empty. Search and add products above.</p>';$('saleTotal').textContent='Total: ৳ 0';return}
el.innerHTML='<table class="table"><thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Total</th><th></th></tr></thead><tbody>'+window.saleCart.map((x,i)=>'<tr><td>'+x.Product_Name+'</td><td>'+money(x.Unit_Price)+'</td><td><input style="width:85px" type="number" min="1" max="'+x.Stock+'" value="'+x.Qty+'" onchange="updateCartQty('+i+',this.value)"></td><td>'+money(x.Unit_Price*x.Qty)+'</td><td><button class="btn danger" onclick="removeCart('+i+')">×</button></td></tr>').join('')+'</tbody></table>';
$('saleTotal').textContent='Total: '+money(window.saleCart.reduce((a,x)=>a+x.Unit_Price*x.Qty,0));
}
function updateCartQty(i,v){const q=Math.max(1,Number(v||1));if(q>window.saleCart[i].Stock){toast('Insufficient stock');return}window.saleCart[i].Qty=q;renderCart()}
function removeCart(i){window.saleCart.splice(i,1);renderCart()}
async function createSaleFromCart(){
if(!window.saleCart.length){toast('Cart is empty');return}
try{const r=await call('createSale',{items:window.saleCart.map(x=>({Product_ID:x.Product_ID,Qty:x.Qty,Unit_Price:x.Unit_Price})),Customer_ID:$('saleCustomer').value,paid:Number($('salePaid').value||0),Payment_Method:$('saleMethod').value});toast('Sale completed: '+r.invoice);printInvoice(r.saleId);window.saleCart=[]}catch(e){toast(e.message||e)}
}
async function loadSales(){
try{const r=await call('sales',{search:$('search')?.value||''});$('table').innerHTML=table(r.rows,['Sale_ID','Invoice_No','Customer_ID','Grand_Total','Paid','Due','Payment_Method','Sale_Date','Status'],x=>'<button class="btn secondary" onclick="printInvoice(\''+x.Sale_ID+'\')">Print</button>')}catch(e){toast(e.message||e)}
}
async function printInvoice(saleId){
try{
const r=await call('invoice',{Sale_ID:saleId}), w=window.open('','_blank');
if(!w){toast('Allow pop-ups to print invoice');return}
w.document.write('<html><head><title>'+r.sale.Invoice_No+'</title><style>body{font-family:Arial,sans-serif;padding:25px;max-width:760px;margin:auto}h1{text-align:center}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.right{text-align:right}</style></head><body><h1>Business POS</h1><p style="text-align:center">Invoice: '+r.sale.Invoice_No+'</p><p>Date: '+r.sale.Sale_Date+'<br>Customer: '+(r.customer?.Name||'Walk-in Customer')+'</p><table><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr>'+r.items.map(x=>'<tr><td>'+x.Product_Name+'</td><td>'+x.Qty+'</td><td>'+money(x.Unit_Price)+'</td><td>'+money(x.Line_Total)+'</td></tr>').join('')+'</table><h3 class="right">Grand Total: '+money(r.sale.Grand_Total)+'</h3><p class="right">Paid: '+money(r.sale.Paid)+' | Due: '+money(r.sale.Due)+'</p><script>window.onload=()=>window.print()<\\/script></body></html>');
w.document.close();
}catch(e){toast(e.message||e)}
}
async function purchases(){main('<div class="page-head"><h2>Purchases</h2></div><div class="card"><p class="muted">Purchase entry uses the same product inventory and updates stock automatically.</p><div id="purchaseItems"></div><button class="btn secondary" onclick="addPurchaseItem()">+ Add Item</button><div class="form-grid" style="margin-top:12px">'+field('purchaseSupplier','Supplier ID')+field('purchasePaid','Paid Amount','0','number')+field('purchaseMethod','Payment Method','Cash')+'</div><div class="actions"><button class="btn" onclick="createPurchase()">Complete Purchase</button></div></div>');addPurchaseItem()}
function addPurchaseItem(){let i=document.createElement('div');i.className='form-grid';i.innerHTML='<div class="field"><label>Product ID</label><input class="purPid"></div><div class="field"><label>Quantity</label><input class="purQty" type="number" value="1"></div><div class="field"><label>Unit Cost</label><input class="purCost" type="number" value="0"></div>'; $('purchaseItems').appendChild(i)}
async function createPurchase(){const ps=[...document.querySelectorAll('.purPid')],items=ps.map((x,i)=>({Product_ID:x.value,Qty:Number(document.querySelectorAll('.purQty')[i].value),Unit_Cost:Number(document.querySelectorAll('.purCost')[i].value)})).filter(x=>x.Product_ID);try{const r=await call('createPurchase',{items,Supplier_ID:$('purchaseSupplier').value,paid:Number($('purchasePaid').value||0),Payment_Method:$('purchaseMethod').value});toast('Purchase completed: '+r.invoice);page('purchases')}catch(e){toast(e.message||e)}}
async function parties(type){
const label=type==='customers'?'Customers':'Suppliers', idKey=type==='customers'?'Customer_ID':'Supplier_ID';
main('<div class="page-head"><h2>'+label+'</h2><button class="btn" onclick="partyModal(\''+type+'\')">+ Add</button></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search name / phone / ID..." oninput="loadParty(\''+type+'\')"></div><div id="partySummary" class="grid" style="margin-bottom:15px"></div><div id="table">Loading...</div></div>');
loadParty(type);
}
function partyModal(type){
  const customer=type==='customers';
  const title=customer?'Add Customer':'Add Supplier';
  modal('<div class="modal-head"><h3>'+title+'</h3><button class="btn secondary" onclick="closeModal()">✕</button></div><div class="form-grid">'+field('partyName','Name')+field('partyPhone','Phone')+field('partyEmail','Email')+field('partyAddress','Address')+field('partyDue','Opening Due','0','number')+'</div><div class="actions"><button class="btn" onclick="savePartyNew(\''+type+'\')">Save</button></div>');
}
async function savePartyNew(type){
  try{
    const p={Name:$('partyName').value,Phone:$('partyPhone').value,Email:$('partyEmail').value,Address:$('partyAddress').value,Opening_Due:Number($('partyDue').value||0),Current_Due:Number($('partyDue').value||0)};
    await call(type==='customers'?'saveCustomer':'saveSupplier',p); closeModal(); toast('Saved successfully'); loadParty(type);
  }catch(e){toast(e.message||e)}
}
async function loadParty(type){
try{
const r=await call(type,{search:$('search')?.value||''}), rows=r.rows||[];
const due=rows.reduce((a,x)=>a+Number(x.Current_Due||0),0);
$('partySummary').innerHTML='<div class="card stat"><div class="label">Total '+(type==='customers'?'Customers':'Suppliers')+'</div><div class="value">'+rows.length+'</div></div><div class="card stat"><div class="label">Total Due</div><div class="value">'+money(due)+'</div></div>';
const idKey=type==='customers'?'Customer_ID':'Supplier_ID';
$('table').innerHTML=table(rows,type==='customers'?['Customer_ID','Name','Phone','Current_Due','Loyalty_Points','Status']:['Supplier_ID','Name','Phone','Current_Due','Status'],x=>'<button class="btn secondary" onclick="partyActions(\''+type+'\',\''+x[idKey]+'\')">Manage</button>');
}catch(e){toast(e.message||e)}
}
function partyActions(type,id){
const title=type==='customers'?'Customer':'Supplier';
modal('<div class="modal-head"><h3>'+title+' — '+id+'</h3><button class="btn secondary" onclick="closeModal()">✕</button></div><div class="toolbar"><button class="btn" onclick="paymentModal(\''+type+'\',\''+id+'\')">💰 Receive/Pay Due</button><button class="btn secondary" onclick="openingModal(\''+type+'\',\''+id+'\')">Opening Balance</button><button class="btn secondary" onclick="showLedger(\''+type+'\',\''+id+'\')">📒 Ledger</button></div><div id="partyLedgerBox" class="muted">Choose an action.</div>');
}
function paymentModal(type,id){
const customer=type==='customers';
modal('<div class="modal-head"><h3>'+(customer?'Receive Customer Payment':'Pay Supplier Due')+'</h3><button class="btn secondary" onclick="closeModal()">✕</button></div><div class="form-grid">'+field('payPartyId','Party ID',id)+field('payAmount','Amount','0','number')+field('payMethod','Method','Cash')+field('payRef','Reference')+'</div><div class="actions"><button class="btn" onclick="savePartyPayment(\''+type+'\')">Save Payment</button></div>');
}
async function savePartyPayment(type){
try{
const p={Amount:Number($('payAmount').value||0),Method:$('payMethod').value,Reference_ID:$('payRef').value};
p[type==='customers'?'Customer_ID':'Supplier_ID']=$('payPartyId').value;
const r=await call(type==='customers'?'customerPayment':'supplierPayment',p);
closeModal();toast('Payment saved. New due: '+money(r.newDue));loadParty(type);
}catch(e){toast(e.message||e)}
}
function openingModal(type,id){
modal('<div class="modal-head"><h3>Opening Balance</h3><button class="btn secondary" onclick="closeModal()">✕</button></div><div class="form-grid">'+field('openPartyId','Party ID',id)+field('openAmount','Amount','0','number')+field('openMethod','Method','Opening Balance')+'</div><div class="actions"><button class="btn" onclick="saveOpening(\''+type+'\')">Save</button></div>');
}
async function saveOpening(type){
try{await call('openingBalance',{Type:type==='customers'?'customer':'supplier',Party_ID:$('openPartyId').value,Amount:Number($('openAmount').value||0),Method:$('openMethod').value});closeModal();toast('Opening balance saved');loadParty(type)}catch(e){toast(e.message||e)}
}
async function showLedger(type,id){
try{
const r=await call('partyLedger',{Type:type==='customers'?'customer':'supplier',Party_ID:id});
$('partyLedgerBox').innerHTML='<p><b>Current Ledger Balance: '+money(r.balance)+'</b></p>'+table(r.rows,['Date','Type','Reference','Debit','Credit','Balance']);
}catch(e){$('partyLedgerBox').textContent=e.message||e}
}
async function expenses(){main('<div class="page-head"><h2>Expenses</h2><button class="btn" onclick="expenseModal()">+ Add Expense</button></div><div class="card"><div id="table">Loading...</div></div>');try{const r=await call('expenses',{});$('table').innerHTML=table(r.rows,['Expense_ID','Amount','Description','Payment_Method','Expense_Date','Created_By'])}catch(e){toast(e.message||e)}}
function expenseModal(){modal('<div class="modal-head"><h3>Add Expense</h3><button class="btn secondary" onclick="closeModal()">✕</button></div><div class="form-grid">'+field('expenseAmount','Amount','0','number')+field('expenseCategory','Category ID')+field('expenseMethod','Payment Method','Cash')+field('expenseDesc','Description')+'</div><div class="actions"><button class="btn" onclick="saveExpense()">Save</button></div>')}
async function saveExpense(){try{await call('saveExpense',{Amount:Number($('expenseAmount').value),Category_ID:$('expenseCategory').value,Payment_Method:$('expenseMethod').value,Description:$('expenseDesc').value});closeModal();toast('Expense saved');expenses()}catch(e){toast(e.message||e)}}
async function reports(){main('<div class="page-head"><h2>Reports</h2></div><div class="grid"><div class="card"><b>Sales</b><p class="muted">Use Sales History for transaction-level report.</p><button class="btn secondary" onclick="page(\'salesHistory\')">Open</button></div><div class="card"><b>Stock</b><p class="muted">Current inventory and valuation.</p><button class="btn secondary" onclick="page(\'inventory\')">Open</button></div><div class="card"><b>Customers</b><p class="muted">Customer due and records.</p><button class="btn secondary" onclick="page(\'customers\')">Open</button></div><div class="card"><b>Suppliers</b><p class="muted">Supplier due and records.</p><button class="btn secondary" onclick="page(\'suppliers\')">Open</button></div></div>')}
async function settings(){main('<div class="page-head"><h2>Settings</h2></div><div class="card"><div id="settingsBox">Loading...</div></div>');try{const s=await call('settings');$('settingsBox').innerHTML=Object.keys(s).map(k=>field(k,k,s[k])).join('')+'<div class="actions"><button class="btn" onclick="saveSettings()">Save Settings</button></div>'}catch(e){toast(e.message||e)}}
async function saveSettings(){const names=['APP_NAME','CURRENCY','TAX_RATE','LOW_STOCK_DEFAULT','AUTO_SYNC','SYNC_INTERVAL','THEME','LANGUAGE'];const p={};names.forEach(k=>{if($(k))p[k]=$(k).value});try{await call('saveSettings',p);toast('Settings saved')}catch(e){toast(e.message||e)}}
async function health(){main('<div class="page-head"><h2>System Health</h2><button class="btn secondary" onclick="health()">↻ Refresh</button></div><div id="healthBox" class="grid"><div class="card">Checking...</div></div>');try{const h=await call('health');$('healthBox').innerHTML=Object.entries(h).map(([k,v])=>'<div class="card"><div class="muted">'+k+'</div><b>'+v+'</b></div>').join('')}catch(e){toast(e.message||e)}}
async function sync(){try{const r=await call('sync');toast('Sync: '+r.status)}catch(e){toast(e.message||e)}}
async function reports(){
  main('<div class="page-head"><h2>Reports</h2><div class="toolbar"><select id="reportPeriod"><option value="today">Today</option><option value="thisWeek">This Week</option><option value="thisMonth" selected>This Month</option><option value="lastMonth">Last Month</option><option value="thisYear">This Year</option></select><button class="btn" onclick="loadReports()">Generate</button></div></div><div id="reportCards" class="grid"></div><div class="two"><div class="card"><h3>Top Products</h3><div id="topProducts"></div></div><div class="card"><h3>Transaction Summary</h3><div id="reportSummary"></div></div></div>');
  loadReports();
}
async function loadReports(){
  try{
    const r=await call('reports',{period:$('reportPeriod')?.value||'thisMonth'});
    $('reportCards').innerHTML=[['Revenue',r.revenue],['COGS',r.cogs],['Gross Profit',r.grossProfit],['Expenses',r.expenseTotal],['Net Profit',r.netProfit],['Purchases',r.purchaseTotal]].map(x=>'<div class="card stat"><div class="label">'+x[0]+'</div><div class="value">'+money(x[1])+'</div></div>').join('');
    $('topProducts').innerHTML=table(r.topProducts||[],['Product_Name','Sales']);
    $('reportSummary').innerHTML='<p>Sales invoices: <b>'+r.salesCount+'</b></p><p>Purchase invoices: <b>'+r.purchaseCount+'</b></p><p>Period: <b>'+r.range.from+' → '+r.range.to+'</b></p>';
  }catch(e){toast(e.message||e)}
}
async function accounting(){
  main('<div class="page-head"><h2>Accounting</h2><button class="btn secondary" onclick="accounting()">↻ Refresh</button></div><div id="accCards" class="grid"></div><div class="card" style="margin-top:15px"><h3>Accounts</h3><div id="accTable">Loading...</div></div>');
  try{const r=await call('accounting',{period:'thisMonth'});$('accCards').innerHTML=[['Revenue',r.revenue],['COGS',r.cogs],['Gross Profit',r.grossProfit],['Expenses',r.expenses],['Net Profit',r.netProfit],['Customer Due',r.customerDue],['Supplier Due',r.supplierDue]].map(x=>'<div class="card stat"><div class="label">'+x[0]+'</div><div class="value">'+money(x[1])+'</div></div>').join('');$('accTable').innerHTML=table(r.accounts,['Account_ID','Account_Name','Account_Type','Balance','Status'])}catch(e){toast(e.message||e)}
}
async function syncCenter(){
  main('<div class="page-head"><h2>Sync Center</h2><div class="toolbar"><button class="btn" onclick="syncNow()">🔄 Sync Now</button><button class="btn secondary" onclick="pushNow()">⬆ Push to Sheets</button></div></div><div id="syncCards" class="grid"></div><div class="card" style="margin-top:15px"><p class="muted">Auto Sync default: 30 seconds. Failed changes remain pending until the next successful push/sync.</p></div>');
  loadSyncStatus();
}
async function loadSyncStatus(){
  try{const r=await call('syncStatus');$('syncCards').innerHTML=[['Status',r.status],['Auto Sync',r.autoSync?'ON':'OFF'],['Interval',r.interval+' sec'],['Pending Changes',r.pendingChanges],['Failed',r.failed],['Last Sync',r.lastSync||'—'],['Last Push',r.lastPush||'—']].map(x=>'<div class="card stat"><div class="label">'+x[0]+'</div><div class="value" style="font-size:16px">'+x[1]+'</div></div>').join('')}catch(e){toast(e.message||e)}
}
async function syncNow(){try{const r=await call('sync');toast('Sync completed');loadSyncStatus()}catch(e){toast(e.message||e)}}
async function pushNow(){try{const r=await call('push');toast('Push completed');loadSyncStatus()}catch(e){toast(e.message||e)}}
async function developer(){
  main('<div class="page-head"><h2>Developer / Code.gs</h2><div class="toolbar"><button class="btn" onclick="loadCode()">↻ Load Code</button><button class="btn secondary" onclick="copyCode()">📋 Copy</button><button class="btn secondary" onclick="downloadCode()">💾 Download</button></div></div><div class="card"><textarea id="codeEditor" style="width:100%;min-height:520px;border:1px solid var(--border);border-radius:12px;padding:14px;font-family:monospace;font-size:12px"></textarea><div class="actions"><button class="btn secondary" onclick="saveCodeDraft()">Save Draft</button><button class="btn danger" onclick="createBackup()">Create Backup</button></div><p class="muted">Save Draft stores the code in Apps Script Script Properties; it does not auto-deploy code.</p></div>');
  loadCode();
}
async function loadCode(){try{const r=await call('code');$('codeEditor').value=r;toast('Code.gs loaded')}catch(e){toast(e.message||e)}}
async function copyCode(){try{await navigator.clipboard.writeText($('codeEditor').value);toast('Code.gs copied successfully')}catch(e){$('codeEditor').select();document.execCommand('copy');toast('Code.gs copied')}} 
function downloadCode(){const blob=new Blob([$('codeEditor').value],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Code.gs';a.click();URL.revokeObjectURL(a.href)}
async function saveCodeDraft(){try{await call('saveCodeDraft',{code:$('codeEditor').value});toast('Draft saved')}catch(e){toast(e.message||e)}}
async function createBackup(){try{const r=await call('backup');toast('Backup created: '+r.name);if(r.url)window.open(r.url,'_blank')}catch(e){toast(e.message||e)}}
function main(x){$('main').innerHTML=x}
function field(id,label,value='',type='text'){return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+type+'" value="'+String(value??'').replace(/"/g,'&quot;')+'"></div>'}
function table(rows,cols,actions){if(!rows.length)return '<p class="muted">No records found.</p>';return '<table class="table"><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+(actions?'<th>Action</th>':'')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+String(r[c]??'').slice(0,80)+'</td>').join('')+(actions?'<td>'+actions(r)+'</td>':'')+'</tr>').join('')+'</tbody></table>'}
function modal(x){$('modalBox').innerHTML=x;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
async function startAutoSync(){
  try{const s=await call('syncStatus'); if(window.syncTimer)clearInterval(window.syncTimer); if(s.autoSync&&s.interval>0) window.syncTimer=setInterval(()=>{if(TOKEN)call('sync').catch(()=>{})},s.interval*1000)}catch(e){}
}
if(TOKEN){call('login',{username:'',password:''}).catch(()=>{}); const hasGAS=typeof google!=='undefined'&&google.script&&google.script.run; if(hasGAS){google.script.run.withSuccessHandler(r=>{USER=r;showApp()}).withFailureHandler(()=>{localStorage.removeItem('pos_token');TOKEN=''}) .getSession(TOKEN)} else {fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,action:'getSession',payload:{}})}).then(r=>r.json()).then(r=>{if(!r.success)throw new Error();USER=r.data;showApp()}).catch(()=>{localStorage.removeItem('pos_token');TOKEN='';})}}
</script>
</body>
</html>
